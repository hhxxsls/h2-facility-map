<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H2 Facility Inventory · Google Maps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen instrument panel. Sticky header with filters; map left (dominant), scrolling stats rail right; detail drawer slides over the rail. Stacks on phones. */
:root {
  --bg: #f3f4f2;          /* page ground, cool-neutral */
  --panel: #fbfbfa;       /* rail + header surface */
  --line: #d9dcd8;
  --line-soft: #e8eae6;
  --fg: #16201f;
  --fg-2: #4d5753;
  --fg-3: #7d8681;
  --accent: #0e6f6a;      /* teal: H2 / electrolysis */
  --accent-soft: #d8ecea;
  --sea: #e4e9ec;         /* map water */
  --land: #d3d6d2;        /* land with no facilities */
  --border-map: #fbfbfa;
  --r1:#c9ccc8; --r2:#b3b7b2; --r3:#9a9f9a; --r4:#7f847f; --r5:#636863; --r6:#454945; /* country shading ramp (neutral, light→dark) */
  --c1:#1c5cab; --c2:#eb6834; --c3:#1baf7a; --c4:#9085e9; --cx:#9aa09c;   /* categorical slots + unspecified */
  --focus: #0e6f6a;
  --shadow: 0 8px 28px rgba(20,30,28,.14);
  --font-display: "Archivo", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#141716; --panel:#1c201f; --line:#303634; --line-soft:#262b29;
    --fg:#eceeec; --fg-2:#b4bbb7; --fg-3:#828a86;
    --accent:#45b8ae; --accent-soft:#1f3a38;
    --sea:#161a1a; --land:#2b302e; --border-map:#141716;
    --r1:#363b39; --r2:#474d4a; --r3:#5b625e; --r4:#717975; --r5:#8b938e; --r6:#aab2ad;
    --c1:#2a78d6; --c2:#d95926; --c3:#1baf7a; --c4:#a394ec; --cx:#6f7673;
    --focus:#45b8ae; --shadow: 0 8px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#141716; --panel:#1c201f; --line:#303634; --line-soft:#262b29;
  --fg:#eceeec; --fg-2:#b4bbb7; --fg-3:#828a86;
  --accent:#45b8ae; --accent-soft:#1f3a38;
  --sea:#161a1a; --land:#2b302e; --border-map:#141716;
  --r1:#363b39; --r2:#474d4a; --r3:#5b625e; --r4:#717975; --r5:#8b938e; --r6:#aab2ad;
  --c1:#2a78d6; --c2:#d95926; --c3:#1baf7a; --c4:#a394ec; --cx:#6f7673;
  --focus:#45b8ae; --shadow: 0 8px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin:0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 13.5px; line-height: 1.45; display:flex; flex-direction:column; }
body::before { content:""; position:fixed; inset:0 0 auto; height: env(safe-area-inset-top, 0px); z-index:10; background: var(--panel); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--accent); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.loading { position: fixed; inset: 0; z-index: 20; background: var(--bg); display:flex; align-items:center; justify-content:center; padding: 24px; }
.loading .box { width: min(360px, 100%); display:grid; gap: 8px; }
.loading .t { font: 600 15px var(--font-display); }
.loading .track { height: 8px; background: var(--line-soft); border-radius: 4px; overflow:hidden; }
.loading .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.loading .m { font-size: 12px; color: var(--fg-2); font-family: var(--font-mono); }
/* ---------- header ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.hdr-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.hdr h1 { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.hdr .sub { color: var(--fg-2); font-size: 12.5px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); }
.filters select, .filters input[type=search] { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; max-width: 100%; }
.filters input[type=search] { width: 190px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--bg); border: 0; padding: 5px 10px; font-size: 12px; color: var(--fg-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.btn { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 12px; color: var(--fg-2); }
.btn:hover { border-color: var(--fg-3); color: var(--fg); }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); }
.active-filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color: var(--fg-2); min-height: 0; }
.active-filters:empty { display:none; }
.chip { display:inline-flex; align-items:center; gap:6px; background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 2px 8px 2px 10px; font-size: 12px; }
.chip b { font-weight: 500; color: var(--fg-2); }
.chip button { border:0; background:transparent; padding:0 2px; line-height:1; color: var(--fg-2); font-size: 14px; }

/* ---------- main ---------- */
.hdr { flex: none; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; flex: 1 1 auto; min-height: 480px; }
.mapwrap { position: relative; background: var(--sea); overflow: hidden; min-width: 0; }
.mapwrap canvas { display:block; width:100%; height:100%; cursor: crosshair; touch-action: none; }
.map-ctl { position:absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); display:flex; flex-direction:column; gap:4px; }
.map-ctl button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 16px; line-height: 1; box-shadow: var(--shadow); }
.map-note { position:absolute; top: 10px; right: 10px; max-width: min(360px, 70%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--fg-2); box-shadow: var(--shadow); }
.map-note b { color: var(--fg); font-weight: 600; }
.legend { position:absolute; bottom: 10px; left: max(10px, env(safe-area-inset-left, 0px)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); max-width: min(300px, 80%); }
.legend h4 { margin: 0 0 4px; font: 600 11px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.legend .row { display:flex; align-items:center; gap:8px; padding: 1px 0; cursor: pointer; }
.legend .row:hover { color: var(--accent); }
.legend .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legend .sw.hollow { background: transparent !important; border: 2px solid var(--fg-2); width: 8px; height: 8px; }
.legend .cnt { margin-left: auto; color: var(--fg-3); }
.legend .shape { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line-soft); color: var(--fg-2); display:grid; gap:2px; }
.tip { position:absolute; pointer-events:none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); max-width: 280px; z-index: 3; }
.tip b { font-weight: 600; display:block; }
.tip .m { color: var(--fg-2); }
.map-status { position:absolute; bottom: 10px; right: 10px; font-size: 11px; color: var(--fg-3); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }

/* ---------- table view ---------- */
.tablewrap { position:absolute; inset:0; background: var(--panel); display:flex; flex-direction:column; z-index: 2; }
.tablebar { display:flex; flex-wrap:wrap; gap: 6px 14px; align-items:center; padding: 8px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--fg-2); }
.tablebar .pg { display:inline-flex; gap: 4px; align-items:center; margin-left:auto; }
.tablebar .pg button { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; font-size: 12px; color: var(--fg-2); }
.tablebar .pg button:disabled { opacity: .4; cursor: default; }
.tablebar select { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; font-size: 12px; }
.tablescroll { flex: 1 1 auto; overflow: auto; min-height: 0; }
.dt { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.dt th, .dt td { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--line-soft); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
.dt th { position: sticky; top: 0; background: var(--panel); color: var(--fg-3); font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; user-select: none; z-index: 1; box-shadow: inset 0 -1px 0 var(--line); }
.dt th:hover { color: var(--fg); }
.dt th.sorted { color: var(--accent); }
.dt th .arrow { font-size: 10px; margin-left: 3px; }
.dt tbody tr { cursor: pointer; }
.dt tbody tr:hover { background: var(--bg); }
.dt tbody tr.sel { background: var(--accent-soft); }
.dt td.r { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dt td.name { font-weight: 500; max-width: 320px; }
.dt td .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align: 0; }
.dt td.lnk a { margin-right: 6px; }
.dt td.lnk { max-width: 420px; }
.dt td.lnk .more { color: var(--fg-3); }
.dt td.muted { color: var(--fg-3); }

/* ---------- stats rail ---------- */
.rail { position: relative; border-left: 1px solid var(--line); background: var(--panel); overflow: hidden; min-width: 0; }
.stats { height: 100%; overflow-y: auto; padding: 12px 14px 24px; padding-right: max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
.tiles { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.tile .v { font-size: 18px; }
.tile { background: var(--bg); border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.tile .k { font-size: 11px; color: var(--fg-3); letter-spacing: .04em; text-transform: uppercase; }
.tile .v { font: 600 20px var(--font-display); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .v small { font: 400 11.5px var(--font-body); color: var(--fg-2); margin-left: 4px; }
.tile .d { font-size: 11.5px; color: var(--fg-2); }
.tile.wide { grid-column: 1 / -1; }
.captab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.captab th, .captab td { padding: 4px 6px; border-bottom: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
.captab th:first-child { text-align: left; font-weight: 500; color: var(--fg-2); white-space: normal; }
.captab thead th { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.captab td.n { color: var(--fg-3); font-size: 11.5px; }
.captab tr.muted th, .captab tr.muted td { color: var(--fg-3); }
.captab tbody td:not(.n) { font-weight: 500; }
.capnote { margin: 6px 0 0; font-size: 11.5px; color: var(--fg-3); line-height: 1.4; }
.chart h3 .chk { font-size: 11px; letter-spacing: 0; text-transform: none; }
.chart h3 { margin: 0 0 6px; font: 600 12px var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--fg-3); display:flex; justify-content: space-between; align-items: baseline; }
.chart h3 span { font-weight: 400; letter-spacing: 0; text-transform: none; }
.bars { display:grid; gap: 3px; }
.bar { display:grid; grid-template-columns: 150px minmax(0,1fr) 48px; align-items:center; gap: 8px; padding: 1px 4px; border-radius: 4px; background: transparent; border: 0; text-align:left; width: 100%; color: var(--fg); }
.bar:hover { background: var(--bg); }
.bar .l { font-size: 12px; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; color: var(--fg-2); }
.bar .t { display:block; height: 10px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
.bar .f { display:block; height: 100%; background: var(--accent); border-radius: 0 2px 2px 0; }
.bar .n { font-size: 12px; text-align: right; color: var(--fg-2); }
.bar.on .l, .bar.on .n { color: var(--fg); font-weight: 600; }
.bar.off { opacity: .45; }
.bar .l i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align: 1px; background: var(--fg-3); }
.hist { width: 100%; height: 110px; display:block; }
.hist rect { fill: var(--accent); }
.hist rect.on { fill: var(--accent); }
.hist rect:hover { fill: var(--c2); }
.hist text { font: 10px var(--font-mono); fill: var(--fg-3); }
.hist line { stroke: var(--line); }
.foot { font-size: 11.5px; color: var(--fg-3); border-top: 1px solid var(--line-soft); padding-top: 10px; }
.foot p { margin: 0 0 4px; }

/* ---------- google maps preview ---------- */
.gmap { margin: 10px 0 2px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.gmap iframe { display:block; width: 100%; aspect-ratio: 4 / 3; border: 0; max-width: 100%; }
.gmap .bar { display:flex; flex-wrap:wrap; gap: 4px 10px; align-items:center; padding: 6px 8px; font-size: 12px; border-top: 1px solid var(--line-soft); background: var(--panel); }
.gmap .bar .seg button { padding: 2px 8px; }
.gmap .bar a { margin-left: auto; }
.gmap .bar a + a { margin-left: 0; }
.dt td.gm a { text-decoration: none; }
/* ---------- detail drawer ---------- */
.drawer { position:absolute; inset:0; background: var(--panel); transform: translateX(100%); transition: transform .22s ease; overflow-y:auto; padding: 12px 14px 24px; padding-right: max(14px, env(safe-area-inset-right, 0px)); z-index: 4; }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer .close { position: sticky; top: 0; float: right; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
.drawer h2 { font: 600 17px var(--font-display); margin: 0 0 2px; text-wrap: balance; padding-right: 60px; }
.drawer .id { font-family: var(--font-mono); color: var(--fg-3); font-size: 12px; }
.tags { display:flex; flex-wrap:wrap; gap:4px; margin: 8px 0 10px; }
.tag { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--fg-2); }
.tag i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align: 0; }
.kv { display:grid; grid-template-columns: 112px minmax(0,1fr); gap: 3px 10px; font-size: 12.5px; }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.drawer h3 { font: 600 12px var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--fg-3); margin: 16px 0 6px; }
.srcs { display:grid; gap: 8px; }
.src { border: 1px solid var(--line-soft); border-radius: 6px; padding: 7px 9px; font-size: 12px; background: var(--bg); }
.src .h { display:flex; flex-wrap: wrap; gap: 4px 10px; color: var(--fg-2); align-items: baseline; }
.src .kind { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; color: var(--accent); }
.src .kind.ref { color: var(--c2); }
.src a, .src .file { overflow-wrap: anywhere; display:block; margin-top: 3px; }
.src .file { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2); }
.src .ev { margin-top: 4px; color: var(--fg-2); font-style: italic; }

@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; height: auto; min-height: 0; }
  .mapwrap { height: 62vh; min-height: 380px; }
  .rail { border-left: 0; border-top: 1px solid var(--line); }
  .stats { height: auto; overflow: visible; padding-left: max(14px, env(safe-area-inset-left, 0px)); }
  .drawer { position: fixed; inset: auto 0 0 0; height: 75vh; border-top: 1px solid var(--line); box-shadow: var(--shadow); transform: translateY(100%); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .drawer.open { transform: none; }
  .hdr { position: static; }
  .map-note { max-width: 60%; font-size: 11px; }
  .legend { font-size: 11px; padding: 6px 8px; }
  .bar { grid-template-columns: 100px minmax(0,1fr) 44px; }
}
</style>

</head>
<body>
<div class="loading" id="loading" hidden><div class="box"><div class="t">Loading the inventory…</div><div class="track"><div class="fill" id="loadfill"></div></div><div class="m" id="loadmsg">connecting</div></div></div>
<header class="hdr">
  <div class="hdr-top">
    <h1>Global hydrogen facility inventory</h1>
    <div class="sub" id="subtitle">Candidate H<sub>2</sub> leakage sources · with Google Maps preview · integrated dataset (step 4, all reference databases), 2026-11-10</div>
  </div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search name, operator, city, facility or site ID…" aria-label="Search">
    <label>Role <select id="f-role"></select></label>
    <label>Type <select id="f-type"></select></label>
    <label>Status <select id="f-status"></select></label>
    <label>Country <select id="f-country"></select></label>
    <label>Found by <select id="f-disc"></select></label>
    <label>Location <select id="f-prec"></select></label>
    <label>Fields <select id="f-cmp"></select></label>
    <button class="btn" id="clear">Clear filters</button>
    <span class="seg" role="group" aria-label="Color points by">
      <button id="cb-role" aria-pressed="true">Color: role</button>
      <button id="cb-status" aria-pressed="false">status</button>
      <button id="cb-family" aria-pressed="false">type group</button>
    </span>
    <label class="chk"><input type="checkbox" id="shade" checked> Shade countries by count</label>
    <span class="seg" role="group" aria-label="View">
      <button id="v-map" aria-pressed="true">Map</button>
      <button id="v-table" aria-pressed="false">Table</button>
    </span>
  </div>
  <div class="active-filters" id="active"></div>
</header>

<div class="main">
  <div class="mapwrap" id="mapwrap">
    <canvas id="map"></canvas>
    <div class="map-ctl">
      <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zreset" title="Reset view" aria-label="Reset view">⌂</button>
    </div>
    <div class="map-note" id="note"></div>
    <div class="legend" id="legend"></div>
    <div class="map-status" id="mapstatus">loading basemap…</div>
    <div class="tip" id="tip" hidden></div>
    <div class="tablewrap" id="tablewrap" hidden>
      <div class="tablebar" id="tablebar"></div>
      <div class="tablescroll"><table class="dt" id="dt"></table></div>
    </div>
  </div>
  <aside class="rail">
    <div class="stats" id="stats"></div>
    <div class="drawer" id="drawer" aria-live="polite"></div>
  </aside>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<script>
const GMAPS_KEY = ''; // optional: a Google Maps Embed API key restricted to this site; empty = keyless embed
function gmapEmbed(lat, lon, sat) {
  return GMAPS_KEY
    ? `https://www.google.com/maps/embed/v1/view?key=${GMAPS_KEY}&center=${lat},${lon}&zoom=16&maptype=${sat ? 'satellite' : 'roadmap'}`
    : `https://maps.google.com/maps?q=${lat},${lon}&z=16&t=${sat ? 'k' : 'm'}&hl=en&output=embed`;
}
const gmapOpen = (lat, lon) => `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
const gmapSat = (lat, lon) => `https://www.google.com/maps/@?api=1&map_action=map&center=${lat},${lon}&zoom=17&basemap=satellite`;
function boot(D) {
  const C = {}; D.cols.forEach((c, i) => C[c] = i);
  const rows = D.rows;
  const N = rows.length;
  const fmt = d3.format(','), fmt1 = d3.format(',.1f');

  // ---------- category groupings ----------
  const GREY = 'cx';

    if (rc.get(-1)) roleItems.push({ label: '(unspecified)', n: rc.get(-1), key: -1, dim: 'role', on: state.role === -1, slot: state.colorBy === 'role' ? GREY : null });
    const dc = count(r => r[C.disc]);
    const discItems = D.discs.map((s, i) => ({ label: s, n: dc.get(i) || 0, key: i, dim: 'disc', on: state.disc === i }));
    const pc = count(r => r[C.prec]);
    const precItems = [...D.precs.map((s, i) => ({ label: s + (['city (not geocoded)', 'country'].includes(s) ? ' ∅' : ''), n: pc.get(i) || 0, key: i, dim: 'prec', on: state.prec === i }))];
    if (pc.get(-1)) precItems.push({ label: '(empty) ∅', n: pc.get(-1), key: -1, dim: 'prec', on: state.prec === -1 });
    const tc = count(r => r[C.type]);
    const typeItems = D.types.map((s, i) => ({ label: s, n: tc.get(i) || 0, key: i, dim: 'type', on: state.type === i, slot: state.colorBy === 'family' ? familySlot[familyOf[s]] : null })).sort((a, b) => b.n - a.n);
    if (tc.get(-1)) typeItems.push({ label: '(unspecified)', n: tc.get(-1), key: -1, dim: 'type', on: state.type === -1, slot: state.colorBy === 'family' ? GREY : null });
    const cc = count(r => r[C.country]);
    const cArr = [...cc.entries()].filter(e => e[0] >= 0).sort((a, b) => b[1] - a[1]);
    const top = cArr.slice(0, 15);
    const countryItems = top.map(([i, n]) => ({ label: countryName(D.countries[i]), n, key: i, dim: 'country', on: state.country === i }));
    const rest = cArr.slice(15).reduce((s, e) => s + e[1], 0);
    if (rest) countryItems.push({ label: `${cArr.length - 15} other countries`, n: rest, key: '', dim: '' });
    if (cc.get(-1)) countryItems.push({ label: '(no country)', n: cc.get(-1), key: -1, dim: 'country', on: state.country === -1 });

    // reference database coverage
    const refc = new Map(); filtered.forEach(r => { const ids = r[C.ref_ids]; if (!ids) return; const seen = new Set(); String(ids).split(';').forEach(x => { const p = x.trim().split(/[-_]/)[0]; if (p && !seen.has(p)) { seen.add(p); refc.set(p, (refc.get(p) || 0) + 1); } }); });

    // year histogram
    const yc = count(r => yearBin(r[C.year])); const yN = T - (yc.get(null) || 0);
    const bins = ['<2000', ...d3.range(2000, 2036).map(String), '>2035'];
    const ymax = Math.max(1, ...bins.map(b => yc.get(b) || 0));
    const W = 360, H = 110, pl = 4, pb = 18, bw = (W - pl * 2) / bins.length;
    const hist = `<section class="chart"><h3>Start year<span>${fmt(yN)} with a year · ${state.year !== null ? 'filtered: ' + state.year : 'click a bar to filter'}</span></h3>
      <svg class="hist" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Facilities by start year">
      <line x1="${pl}" x2="${W - pl}" y1="${H - pb + .5}" y2="${H - pb + .5}"/>` +
      bins.map((b, i) => { const n = yc.get(b) || 0; const h = n ? Math.max(2, (H - pb - 6) * n / ymax) : 0; return `<rect data-year="${b}" x="${(pl + i * bw + 1).toFixed(1)}" y="${(H - pb - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1" opacity="${state.year !== null && state.year !== b ? .35 : 1}"><title>${b}: ${fmt(n)}</title></rect>`; }).join('') +
      [0, 5, 15, 25, 35, 37].map(i => `<text x="${(pl + i * bw + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${bins[i] === '<2000' ? '<2000' : bins[i] === '>2035' ? '>2035' : bins[i]}</text>`).join('') +
      `</svg></section>`;

    const covItems = fieldTests.map(([k, l, fn]) => ({ label: l, n: filtered.filter(fn).length, key: 'has:' + k, dim: 'cmp', on: state.cmp === 'has:' + k }));
    const nAll8 = filtered.filter(r => cmpMatch(r, 'all8')).length, nCore = filtered.filter(r => cmpMatch(r, 'core7')).length;
    covItems.push({ label: 'Core fields (all but year)', n: nCore, key: 'core7', dim: 'cmp', on: state.cmp === 'core7' }, { label: 'All 8 key fields', n: nAll8, key: 'all8', dim: 'cmp', on: state.cmp === 'all8' });
    const coverage = barList('Field coverage', covItems, { total: T, note: 'click to keep only rows with that field' });
    document.getElementById('stats').innerHTML = tiles + coverage + capTable +
      barList('Status', statusItems, { total: T }) +
      barList('Hydrogen role', roleItems, { total: T }) +
      barList('Facility type', typeItems, { total: T }) +
      barList('Country', countryItems, { total: T, note: 'top 15' }) +
      hist +
      barList('Discovered by', discItems, { total: T, note: 'crawl vs reference DBs' }) +
      barList('Location precision', precItems, { total: T, note: '∅ = no coordinates' }) +
      barList('In reference databases', [...refc.entries()].sort((a, b) => b[1] - a[1]).map(([k, n]) => ({ label: refLabel[k] || k, n, key: '', dim: '' })), { total: T, note: 'facilities matched to each DB' }) +
      `<div class="foot"><p>Counts are recomputed from facilities_final.csv for the current selection. Point color: ${mode.label.toLowerCase()}. Solid dots have site/address-level or IEA/reference coordinates; hollow dots are geocoded to a city or region centroid.</p><p>Country shading uses every facility assigned to that country, including the ones without coordinates.</p><p>“All 8 key fields” = hydrogen role, facility type other than “other”, operator, country, coordinates, a status other than unknown, start year, and a capacity in t/yr or MW.</p></div>`;

    document.getElementById('inc-agg').addEventListener('change', e => { state.incAgg = e.target.checked; renderStats(); });
    document.querySelectorAll('#stats .bar').forEach(b => b.addEventListener('click', () => { if (b.dataset.dim === 'cmp') setCmp(b.dataset.key); else if (b.dataset.dim) setFilter(b.dataset.dim, +b.dataset.key); }));
    document.querySelectorAll('#stats .hist rect').forEach(r => r.addEventListener('click', () => { state.year = state.year === r.dataset.year ? null : r.dataset.year; applyFilters(); }));
  }

  function renderLegend() {
    const mode = colorModes[state.colorBy]; const cnt = count(mode.cat);
    const el = document.getElementById('legend');
    el.innerHTML = `<h4>${mode.label}</h4>` + mode.order.filter(k => cnt.get(k)).map(k => `<div class="row" data-k="${k}"><span class="sw" style="background:${col(mode.slot(k))}"></span>${k}<span class="cnt num">${fmt(cnt.get(k))}</span></div>`).join('') +
      `<div class="shape"><span><span class="sw" style="display:inline-block;background:var(--fg-2);vertical-align:-1px;margin-right:6px"></span>site / address / project point</span><span><span class="sw hollow" style="display:inline-block;vertical-align:-1px;margin-right:6px"></span>city or region centroid</span></div>`;
    el.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => {
      const k = r.dataset.k;
      if (state.colorBy === 'role') setFilter('role', k === 'unspecified' ? -1 : D.roles.indexOf(k));
      else if (state.colorBy === 'status') { const s = Object.keys(statusGroup).find(x => statusGroup[x] === k); if (s) setFilter('status', D.statuses.indexOf(s)); }
      else { const t = Object.keys(familyOf).find(x => familyOf[x] === k); if (k === 'unspecified') setFilter('type', -1); else if (t) setFilter('type', D.types.indexOf(t)); }
    }));
  }
  function renderNote() {
    const T = filtered.length, un = filtered.filter(r => r[C.lat] == null).length;
    document.getElementById('note').innerHTML = `<b>${fmt(T - un)}</b> facilities on the map. Another <b>${fmt(un)}</b> in this selection have no coordinates (country-level or ungeocoded city) and are not drawn, but are counted in the statistics and in the country shading.`;
  }

  // ---------- map ----------
  const wrap = document.getElementById('mapwrap'), canvas = document.getElementById('map'), ctx = canvas.getContext('2d');
  const tip = document.getElementById('tip');
  let W = 10, H = 10, dpr = 1, transform = d3.zoomIdentity, land = null, borders = null, countryFeat = [], quad = null, proj = null, path = null, hover = null;
  const projection = d3.geoNaturalEarth1();

  function loadWorld() {
    try {
      const topo = window.Datamap && Datamap.prototype.worldTopo;
      if (!topo) throw new Error('no topo');
      const key = Object.keys(topo.objects)[0];
      const fc = topojson.feature(topo, topo.objects[key]);
      countryFeat = fc.features.filter(f => f.id !== 'ATA');
      land = { type: 'FeatureCollection', features: countryFeat };
      borders = topojson.mesh(topo, topo.objects[key], (a, b) => a !== b);
      window.__cname = {}; countryFeat.forEach(f => { if (f.properties && f.properties.name) window.__cname[f.id] = f.properties.name; });
      fillCountries();
      document.getElementById('mapstatus').textContent = 'Basemap: Natural Earth 110m · Natural Earth projection';
    } catch (e) {
      land = null; document.getElementById('mapstatus').textContent = 'Basemap could not be loaded; showing graticule and points only';
    }
  }

  function resize() {
    const r = wrap.getBoundingClientRect(); W = Math.max(10, r.width); H = Math.max(10, r.height); dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    projection.fitExtent([[6, 6], [W - 6, H - 6]], { type: 'Sphere' });
    path = d3.geoPath(projection, ctx);
    buildIndex(); draw();
  }
  function buildIndex() {
    const pts = [];
    for (const r of filtered) { if (r[C.lat] == null) continue; const p = projection([r[C.lon], r[C.lat]]); if (!p) continue; pts.push({ x: p[0], y: p[1], r }); }
    quad = d3.quadtree().x(d => d.x).y(d => d.y).addAll(pts);
    quad._pts = pts;
  }

  function ramp(n) { if (!n) return null; if (n < 3) return 'r1'; if (n < 10) return 'r2'; if (n < 30) return 'r3'; if (n < 100) return 'r4'; if (n < 300) return 'r5'; return 'r6'; }

  function draw() {
    if (!path) return;
    const t = transform, k = t.k;
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = cssVars.sea; ctx.fillRect(0, 0, W, H);
    ctx.translate(t.x, t.y); ctx.scale(k, k);
    // sphere
    ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = cssVars.sea; ctx.fill(); ctx.lineWidth = 1 / k; ctx.strokeStyle = cssVars.line; ctx.stroke();
    if (land) {
      const cc = state.shade ? count(r => r[C.country] >= 0 ? D.countries[r[C.country]] : null) : null;
      for (const f of countryFeat) {
        const n = cc ? cc.get(f.id) : 0; const slot = ramp(n);
        ctx.beginPath(); path(f); ctx.fillStyle = slot ? cssVars[slot] : cssVars.land; ctx.fill();
      }
      ctx.beginPath(); path(borders); ctx.lineWidth = 0.6 / k; ctx.strokeStyle = cssVars['border-map']; ctx.stroke();
    } else {
      ctx.beginPath(); path(d3.geoGraticule10()); ctx.lineWidth = 0.5 / k; ctx.strokeStyle = cssVars.line; ctx.stroke();
    }
    // points
    const mode = colorModes[state.colorBy];
    const pts = quad ? quad._pts : [];
    const rad = (2.4 + 0.5 * Math.log2(k)) / k;
    const groups = new Map();
    for (const p of pts) { const s = mode.slot(mode.cat(p.r)); const solid = precSolid.has(D.precs[p.r[C.prec]]); const key = s + (solid ? '1' : '0'); let g = groups.get(key); if (!g) { g = { s, solid, pts: [] }; groups.set(key, g); } g.pts.push(p); }
    // hollow first, then solid, grey first
    const order = [...groups.values()].sort((a, b) => (a.solid - b.solid) || ((a.s === GREY ? 0 : 1) - (b.s === GREY ? 0 : 1)));
    for (const g of order) {
      ctx.beginPath();
      for (const p of g.pts) { ctx.moveTo(p.x + rad, p.y); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2); }
      if (g.solid) { ctx.fillStyle = col(g.s); ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1; ctx.lineWidth = 0.5 / k; ctx.strokeStyle = cssVars.panel; ctx.stroke(); }
      else { ctx.lineWidth = 1.1 / k; ctx.strokeStyle = col(g.s); ctx.globalAlpha = 0.8; ctx.stroke(); ctx.globalAlpha = 1; }
    }
    // selected
    const selP = state.selected && pts.find(p => p.r[C.id] === state.selected);
    for (const p of [hover, selP].filter(Boolean)) {
      ctx.beginPath(); ctx.arc(p.x, p.y, rad + 3 / k, 0, Math.PI * 2); ctx.lineWidth = 2 / k; ctx.strokeStyle = cssVars.fg; ctx.stroke();
    }
    ctx.restore();
  }

  const zoom = d3.zoom().scaleExtent([1, 60]).on('zoom', e => { transform = e.transform; draw(); });
  d3.select(canvas).call(zoom).on('dblclick.zoom', null);
  document.getElementById('zin').addEventListener('click', () => d3.select(canvas).transition().duration(200).call(zoom.scaleBy, 1.6));
  document.getElementById('zout').addEventListener('click', () => d3.select(canvas).transition().duration(200).call(zoom.scaleBy, 1 / 1.6));
  document.getElementById('zreset').addEventListener('click', () => d3.select(canvas).transition().duration(300).call(zoom.transform, d3.zoomIdentity));

  function find(ev) {
    if (!quad) return null;
    const rect = canvas.getBoundingClientRect(); const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    const [x, y] = transform.invert([mx, my]);
    const tol = 7 / transform.k; return quad.find(x, y, tol) || null;
  }
  canvas.addEventListener('mousemove', ev => {
    const p = find(ev); if (p !== hover) { hover = p; draw(); }
    if (p) {
      const r = p.r; const sp = transform.apply([p.x, p.y]);
      tip.innerHTML = `<b>${esc(r[C.name])}</b><span class="m">${D.types[r[C.type]] || '—'} · ${D.statuses[r[C.status]]} · ${countryName(D.countries[r[C.country]] || '')}${r[C.operator] ? '<br>' + esc(r[C.operator]) : ''}${r[C.capstr] ? '<br>' + esc(r[C.capstr]) : ''}<br>${D.precs[r[C.prec]] || 'no precision'} · ${r[C.nsrc]} source${r[C.nsrc] === 1 ? '' : 's'}</span>`;
      tip.hidden = false;
      const left = sp[0] + 14 + 290 > W ? sp[0] - 14 - 290 : sp[0] + 14;
      tip.style.left = Math.max(4, left) + 'px'; tip.style.top = Math.min(H - 90, Math.max(4, sp[1] - 20)) + 'px';
    } else tip.hidden = true;
  });
  canvas.addEventListener('mouseleave', () => { tip.hidden = true; if (hover) { hover = null; draw(); } });
  canvas.addEventListener('click', ev => { const p = find(ev); if (p) openDetail(p.r); });

  // ---------- detail drawer ----------
  const drawer = document.getElementById('drawer');
  function esc(s) { return s == null ? '' : String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function openDetail(r) {
    state.selected = r[C.id]; draw();
    const mode = colorModes[state.colorBy];
    const tag = (txt, slot) => `<span class="tag">${slot ? `<i style="background:${col(slot)}"></i>` : ''}${esc(txt)}</span>`;
    const role = r[C.role] >= 0 ? D.roles[r[C.role]] : null, type = r[C.type] >= 0 ? D.types[r[C.type]] : null, st = D.statuses[r[C.status]];
    const srcs = D.sources[r[C.id]] || [];
    const kv = [];
    const add = (k, v) => { if (v != null && v !== '') kv.push(`<dt>${k}</dt><dd>${v}</dd>`); };
    add('Operator', esc(r[C.operator]));
    add('Location', [r[C.city], r[C.region], countryName(D.countries[r[C.country]] || '')].filter(Boolean).map(esc).join(', '));
    add('Coordinates', r[C.lat] != null ? `<span class="num">${r[C.lat].toFixed(4)}, ${r[C.lon].toFixed(4)}</span> · ${esc(D.precs[r[C.prec]] || 'unspecified')}${r[C.coord_source] ? ' · ' + esc(r[C.coord_source]) : ''}` : `none · ${esc(D.precs[r[C.prec]] || 'precision not given')}`);
    add('Capacity', esc(r[C.capstr]));
    add('Capacity (MW)', r[C.mw] != null ? `<span class="num">${fmt1(r[C.mw])}</span> MW` : null);
    add('H₂ capacity', r[C.h2t] != null ? `<span class="num">${fmt(Math.round(r[C.h2t]))}</span> t/yr · ${esc(D.basis[r[C.basis]] || '')}` : null);
    add('Start year', r[C.year]);
    add('Status date', esc(r[C.status_date]));
    add('Discovered by', esc(D.discs[r[C.disc]]));
    add('Records / sources', `${r[C.nrec]} crawled records · ${r[C.nsrc]} sources`);
    const siteMates = r[C.site] ? rows.filter(x => x[C.site] === r[C.site] && x[C.id] !== r[C.id]) : [];
    add('Plant site', `<span class="num">${esc(r[C.site] || '')}</span>${r[C.site_basis] ? ' · ' + esc(r[C.site_basis]) : ''}${siteMates.length ? '<br>Also at this site: ' + siteMates.map(x => `<a href="#" class="mate" data-id="${x[C.id]}">${esc(x[C.name])}</a> <span style="color:var(--fg-3)">(${esc(D.types[x[C.type]] || '')})</span>`).join('; ') : ''}`);
    add('Reference entity', esc(r[C.ref_entity]));
    add('Reference IDs', esc(r[C.ref_ids]));
    add('Other names', esc(r[C.other_names]));
    add('Flags', esc(r[C.flags]));
    add('Conflicts', esc(r[C.conflicts]));
    drawer.innerHTML = `<button class="close" id="dclose">Close ×</button><h2>${esc(r[C.name])}</h2><div class="id">${r[C.id]}</div>
      <div class="tags">${isAgg(r) ? '<span class="tag" style="border-color:var(--c2);color:var(--c2)">aggregate row</span>' : ''}${role ? tag(role, roleSlot[role]) : ''}${type ? tag(type, familySlot[familyOf[type]]) : ''}${tag(st, statusSlot[statusGroup[st]])}</div>
      <dl class="kv">${kv.join('')}</dl>
      ${r[C.lat] != null ? `<div class="gmap" id="gmap"><iframe id="gmap-frame" src="${gmapEmbed(r[C.lat], r[C.lon], true)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen title="Google Maps"></iframe>
        <div class="bar"><span class="seg"><button id="gm-sat" aria-pressed="true">Satellite</button><button id="gm-map" aria-pressed="false">Map</button></span>
        <a href="${gmapOpen(r[C.lat], r[C.lon])}" target="_blank" rel="noopener">Open in Google Maps ↗</a><a href="${gmapSat(r[C.lat], r[C.lon])}" target="_blank" rel="noopener">satellite ↗</a></div></div>` : `<p class="capnote">No coordinates for this facility, so no map preview.</p>`}
      <h3>Sources (${srcs.length})</h3><div class="srcs">` + srcs.map(s => {
        const url = s[2] || ''; const isUrl = /^https?:\/\//i.test(url);
        return `<div class="src"><div class="h"><span class="kind${s[0] ? ' ref' : ''}">${s[0] ? 'reference' : 'crawled record'}</span>${s[3] ? `<span class="num">${esc(s[3])}</span>` : ''}${s[4] ? `<span>${esc(s[4])}</span>` : ''}${s[5] ? `<span>${esc(s[5])}</span>` : ''}<span class="num" style="color:var(--fg-3)">${esc(s[1])}</span></div>${isUrl ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>` : `<span class="file">${esc(url)}</span>`}${s[6] ? `<div class="ev">“${esc(s[6])}”</div>` : ''}</div>`;
      }).join('') + `</div>`;
    drawer.classList.add('open'); drawer.scrollTop = 0;
    document.getElementById('dclose').addEventListener('click', closeDetail);
    const gmS = document.getElementById('gm-sat'), gmM = document.getElementById('gm-map');
    if (gmS) { const sw = sat => { document.getElementById('gmap-frame').src = gmapEmbed(r[C.lat], r[C.lon], sat); gmS.setAttribute('aria-pressed', sat); gmM.setAttribute('aria-pressed', !sat); }; gmS.addEventListener('click', () => sw(true)); gmM.addEventListener('click', () => sw(false)); }
    drawer.querySelectorAll('a.mate').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const x = rows.find(y => y[C.id] === a.dataset.id); if (x) openDetail(x); }));
  }
  function closeDetail() { drawer.classList.remove('open'); state.selected = null; draw(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

  // ---------- boot ----------
  readVars(); loadWorld(); applyFilters(); resize();
  window.addEventListener('resize', resize);
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const retheme = () => { readVars(); renderStats(); renderLegend(); draw(); };
  mq.addEventListener ? mq.addEventListener('change', retheme) : mq.addListener(retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());
}
</script>
<script>
(async function () {
  const ov = document.getElementById('loading'), fill = document.getElementById('loadfill'), msg = document.getElementById('loadmsg');
  ov.hidden = false;
  const mb = n => (n / 1048576).toFixed(1) + ' MB';
  async function get(url, decompress) {
    const res = await fetch(url, { cache: 'force-cache' });
    if (!res.ok) throw new Error(url + ' ' + res.status);
    const total = +res.headers.get('content-length') || 0;
    let got = 0; const chunks = [];
    const reader = res.body.getReader();
    while (true) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length;
      fill.style.width = total ? (100 * got / total).toFixed(1) + '%' : '30%'; msg.textContent = 'downloading data ' + mb(got) + (total ? ' / ' + mb(total) : ''); }
    let blob = new Blob(chunks);
    if (decompress) { const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer()); if (head[0] === 0x1f && head[1] === 0x8b) { msg.textContent = 'decompressing…'; blob = await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob(); } }
    msg.textContent = 'parsing…'; return JSON.parse(await blob.text());
  }
  let D;
  try { if (typeof DecompressionStream === 'undefined') throw new Error('no DecompressionStream'); D = await get('data.json.gz', true); }
  catch (e) { console.warn('gz load failed, falling back to data.json', e); try { D = await get('data.json', false); } catch (e2) { msg.textContent = 'Could not load the data file: ' + e2.message; return; } }
  ov.hidden = true; boot(D);
})();
</script>
